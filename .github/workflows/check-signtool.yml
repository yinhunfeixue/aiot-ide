name: Check signtool

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-2022
    steps:
      - name: Check signtool in bash
        shell: bash
        run: |
          echo "=== which signtool.exe ==="
          which signtool.exe || echo "NOT FOUND in bash PATH"
          echo ""
          echo "=== PATH ==="
          echo "$PATH" | tr ':' '\n' | grep -i sdk || echo "No SDK in PATH"

      - name: Check signtool in powershell
        shell: pwsh
        run: |
          Write-Host "=== where.exe signtool.exe ==="
          where.exe signtool.exe 2>&1
          Write-Host ""
          Write-Host "=== Get-Command ==="
          Get-Command signtool.exe -ErrorAction SilentlyContinue | Format-List
          Write-Host ""
          Write-Host "=== Search Windows SDK dirs ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Check signtool in cmd
        shell: cmd
        run: |
          echo === where signtool.exe ===
          where signtool.exe 2>&1 || echo NOT FOUND in cmd PATH
