name: Build Tunnel CLI
description: Build the Rust tunnel CLI binary and copy to build output

inputs:
  vscode_arch:
    description: 'Architecture (x64 or arm64)'
    required: true

runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build tunnel CLI
      shell: bash
      run: |
        cd cli
        npm pack @vscode/openssl-prebuilt@0.0.11
        mkdir -p openssl
        tar -xzf vscode-openssl-prebuilt-0.0.11.tgz --strip-components=1 --directory=openssl

        TUNNEL_NAME=$(node -p "require('../product.json').tunnelApplicationName")
        NAME_SHORT=$(node -p "require('../product.json').nameShort")
        ARCH="${{ inputs.vscode_arch }}"
        OS_NAME="$(uname -s)"

        case "${OS_NAME}" in
          Darwin)
            export OPENSSL_LIB_DIR="$(pwd)/openssl/out/${ARCH}-osx/lib"
            export OPENSSL_INCLUDE_DIR="$(pwd)/openssl/out/${ARCH}-osx/include"
            if [[ "${ARCH}" == "arm64" ]]; then
              RUST_TARGET="aarch64-apple-darwin"
            else
              RUST_TARGET="x86_64-apple-darwin"
            fi
            rustup target add "${RUST_TARGET}"
            cargo build --release --target "${RUST_TARGET}" --bin=code
            cp "target/${RUST_TARGET}/release/code" "../../VSCode-darwin-${ARCH}/${NAME_SHORT}.app/Contents/Resources/app/bin/${TUNNEL_NAME}"
            ;;
          Linux)
            export OPENSSL_LIB_DIR="$(pwd)/openssl/out/${ARCH}-linux/lib"
            export OPENSSL_INCLUDE_DIR="$(pwd)/openssl/out/${ARCH}-linux/include"
            if [[ "${ARCH}" == "arm64" ]]; then
              RUST_TARGET="aarch64-unknown-linux-gnu"
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
              export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
              export PKG_CONFIG_ALLOW_CROSS=1
            else
              RUST_TARGET="x86_64-unknown-linux-gnu"
            fi
            rustup target add "${RUST_TARGET}"
            cargo build --release --target "${RUST_TARGET}" --bin=code
            cp "target/${RUST_TARGET}/release/code" "../../VSCode-linux-${ARCH}/bin/${TUNNEL_NAME}"
            ;;
          MINGW*|MSYS*)
            export OPENSSL_LIB_DIR="$(pwd)/openssl/out/${ARCH}-windows-static/lib"
            export OPENSSL_INCLUDE_DIR="$(pwd)/openssl/out/${ARCH}-windows-static/include"
            if [[ "${ARCH}" == "arm64" ]]; then
              RUST_TARGET="aarch64-pc-windows-msvc"
            else
              RUST_TARGET="x86_64-pc-windows-msvc"
            fi
            rustup target add "${RUST_TARGET}"
            cargo build --release --target "${RUST_TARGET}" --bin=code
            cp "target/${RUST_TARGET}/release/code.exe" "../../VSCode-win32-${ARCH}/bin/${TUNNEL_NAME}.exe"
            ;;
        esac
